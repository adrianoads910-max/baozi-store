spring.application.name=baozi-store
server.port=8081

# Banco relacional H2 salvo em arquivo (os dados continuam após reiniciar a aplicação)
spring.datasource.url=jdbc:h2:file:./data/baozistore
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# Cria/atualiza as tabelas a partir das entidades JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Console web do H2: http://localhost:8080/h2-console
spring.h2.console.enabled=true
